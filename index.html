<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSPD Record Management System</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b1a33'/%3E%3Cpath d='M16 5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L16 19.7 10.1 23l1.2-6.5-4.8-4.6 6.6-.9z' fill='%23b8912f'/%3E%3C/svg%3E">
  <script>
    /* apply the saved theme before first paint */
    try { var s = JSON.parse(localStorage.getItem('lspd_settings') || '{}'); if (s.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/paper.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></symbol>
    <symbol id="i-incident" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M8 18h2M12 18h2"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></symbol>
    <symbol id="i-draft" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.3 3.3 0 0 1 4.7 4.7L9.5 17a1.7 1.7 0 0 1-2.4-2.4L14 7.7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
      <a class="brand" href="#/dashboard">
        <img class="seal" src="assets/LSPD-SEALS.png" alt="" onerror="this.onerror=null;this.src=UI.SEAL">
        <span><span class="brand-name">LOS SANTOS POLICE DEPARTMENT</span><span class="brand-sub">RECORD MANAGEMENT SYSTEM</span></span>
      </a>
      <span class="top-spacer"></span>
      <div class="top-meta">
        <span class="top-clock" id="topClock"></span>
        <span class="top-officer" id="topOfficer"></span>
        <span class="tag-local" title="Data is stored only in this browser">LOCAL MODE</span>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="nav-group">
        <a class="nav-link" data-nav="dashboard" href="#/dashboard"><svg class="ic"><use href="#i-dashboard"/></svg>Dashboard</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">REPORTS</div>
        <a class="nav-link" data-nav="incident" href="#/incident"><svg class="ic"><use href="#i-incident"/></svg>Incident<span class="nav-count" id="cntIncident"></span></a>
        <a class="nav-link" data-nav="surveillance" href="#/surveillance"><svg class="ic"><use href="#i-eye"/></svg>Surveillance<span class="nav-count" id="cntSurveillance"></span></a>
      </div>
      <div class="nav-group">
        <div class="nav-label">TOOLS</div>
        <a class="nav-link" data-nav="penal" href="#/penal"><svg class="ic"><use href="#i-calc"/></svg>Penal Calc</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">RECORDS</div>
        <a class="nav-link" data-nav="records" href="#/records"><svg class="ic"><use href="#i-archive"/></svg>All records</a>
        <a class="nav-link" data-nav="drafts" href="#/records?status=draft"><svg class="ic"><use href="#i-draft"/></svg>Drafts<span class="nav-count" id="cntDrafts"></span></a>
      </div>
      <div class="nav-group">
        <div class="nav-label">SYSTEM</div>
        <a class="nav-link" data-nav="settings" href="#/settings"><svg class="ic"><use href="#i-sliders"/></svg>Settings</a>
      </div>
      <div class="side-foot">Local storage mode. Records stay on this device and are not synced to a server.</div>
    </nav>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <dialog id="dlgConfirm" aria-labelledby="dlgConfirmTitle">
    <form method="dialog">
      <div class="dlg-head"><h2 id="dlgConfirmTitle">Confirm</h2></div>
      <div class="dlg-body"><p id="dlgConfirmMsg"></p></div>
      <div class="dlg-foot">
        <button class="btn" value="cancel" id="dlgConfirmCancel">Cancel</button>
        <button class="btn btn-primary" value="ok" id="dlgConfirmOk">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgCodes" class="dlg-wide" aria-labelledby="codesTitle">
    <div class="dlg-head"><h2 id="codesTitle">Penal code list</h2>
      <form method="dialog"><button class="btn btn-sm" aria-label="Close">Close</button></form></div>
    <div class="dlg-search"><label><span class="sr">Search codes</span><input id="codesSearch" class="input" type="search" placeholder="Search by code or offense name" autocomplete="off"></label></div>
    <div class="dlg-body dlg-scroll" id="codesBody"></div>
  </dialog>

  <input type="file" id="fileImport" accept="application/json,.json" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/penal-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/records.js"></script>
  <script src="js/penal.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/doc.js"></script>
  <script src="js/incident.js"></script>
  <script src="js/surveillance.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
